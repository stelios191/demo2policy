[project]
name = "demo2policy"
version = "0.1.0"
description = "Behavior cloning from public human demonstrations on simulated Lift, with reproducible evaluation."
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12
